<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Open KurvAgent Application</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #ffffff;
    color: #1f2937;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  #statusBar {
    padding: 10px 14px;
    font-size: 13px;
    border-bottom: 1px solid #e5e7eb;
    color: #4b5563;
    flex: 0 0 auto;
  }
  #statusBar.error {
    color: #b91c1c;
    background: #fef2f2;
  }
  #main {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    text-align: center;
  }
  #main p {
    color: #6b7280;
    font-size: 14px;
    max-width: 360px;
    margin: 0;
  }
  button {
    font-size: 14px;
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid #d1d5db;
    background: #fff;
    cursor: pointer;
  }
  button.primary {
    background: #2563eb;
    border-color: #2563eb;
    color: #fff;
  }
  button.primary:disabled {
    background: #93c5fd;
    border-color: #93c5fd;
    cursor: not-allowed;
  }
  button:hover:not(:disabled) {
    filter: brightness(0.97);
  }
  #openBtn {
    font-size: 16px;
    padding: 12px 24px;
    background: #22a276;
    border-color: #22a276;
  }
  #openBtn:disabled {
    background: #8fd0b8;
    border-color: #8fd0b8;
  }

  /* ---- Missing-fields form ---- */
  #missingForm {
    display: none;
    width: 100%;
    max-width: 340px;
    text-align: left;
  }
  #missingForm .field {
    margin-bottom: 12px;
  }
  #missingForm label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 4px;
    color: #374151;
  }
  #missingForm input {
    width: 100%;
    box-sizing: border-box;
    font-size: 14px;
    padding: 8px 10px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
  }
  #missingForm input.invalid {
    border-color: #dc2626;
    background: #fef2f2;
  }
  #missingForm .fieldError {
    font-size: 12px;
    color: #b91c1c;
    margin-top: 3px;
    min-height: 14px;
  }
  #missingForm .actions {
    text-align: center;
    margin-top: 8px;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="statusBar">Loading...</div>
  <div id="main">
    <p id="mainText">Looking up this Lead's application link...</p>

    <form id="missingForm" novalidate>
      <div id="missingFields"></div>
      <div class="actions">
        <button type="submit" id="saveBtn" class="primary">Save &amp; Continue</button>
      </div>
    </form>

    <button id="openBtn" class="primary" style="display:none">Open Application</button>
  </div>
</div>

<!--
  Zoho CRM Widget JS SDK.
  NOTE: verify this script src / version against your org's current Developer
  Space widget template (matches the version used in the other KurvAgent
  widgets in this repo).
-->
<script src="https://live.zwidgets.com/js-sdk/1.1/ZohoEmbededAppSDK.min.js"></script>

<script>
(function () {
  // Opens the Lead's own Application_URL field value in a new tab (not a
  // static KurvAgent link, not an iframe). Use this on records where the
  // application already exists in KurvAgent and has a real, unique
  // Application_URL saved on the Lead.
  //
  // Before anything opens, the widget checks REQUIRED_FIELDS. If any are
  // empty, the rep must fill them in here; they're saved to the Lead before
  // the blueprint transition is allowed to proceed (so the After action /
  // SendLeadToStratus2 sees the completed record).
  //
  // If the Lead has no Application_URL yet, the button becomes
  // "Create & Open Application": it calls the standalone Deluge function
  // SendLeadToStratusFromWidget, then opens the URL it returns. After the
  // missing-fields save, it first waits up to 20s for the Lead workflow to
  // generate the app, so it doesn't create a duplicate.
  var APPLICATION_URL_FIELD = "Application_URL";
  var FALLBACK_URL = "https://agent.kurvpay.com/"; // used only if creating the app fails

  // API name of the standalone function (Setup > Developer Hub > Functions).
  var CREATE_APP_FUNCTION = "sendleadtostratusfromwidget";

  // API name -> label. Add "Company": "Company" here to require it too.
  var REQUIRED_FIELDS = {
    First_Name: "First Name",
    Email: "Email",
    Phone: "Phone"
  };

  var INPUT_TYPES = { Email: "email", Phone: "tel" };

  var statusBar = document.getElementById("statusBar");
  var mainText = document.getElementById("mainText");
  var openBtn = document.getElementById("openBtn");
  var missingForm = document.getElementById("missingForm");
  var missingFieldsEl = document.getElementById("missingFields");
  var saveBtn = document.getElementById("saveBtn");

  var currentModule = null;
  var currentRecordId = null;
  var applicationUrl = null;
  var needsCreate = false;
  var missingList = [];

  function setStatus(msg, isError) {
    statusBar.textContent = msg;
    statusBar.className = isError ? "error" : "";
  }

  function isBlank(v) {
    return v === null || v === undefined || String(v).trim() === "";
  }

  if (typeof ZOHO === "undefined") {
    setStatus(
      "This page must be opened inside a Zoho CRM widget, not previewed standalone.",
      true
    );
    mainText.textContent = "Zoho SDK not detected.";
    return;
  }

  // ---------- Load record ----------
  function loadRecord() {
    setStatus("Loading Lead details...");
    return ZOHO.CRM.API.getRecord({ Entity: currentModule, RecordID: currentRecordId })
      .then(function (response) {
        var record = response.data[0];

        missingList = Object.keys(REQUIRED_FIELDS).filter(function (f) {
          return isBlank(record[f]);
        });

        if (missingList.length > 0) {
          showMissingForm(missingList);
          return;
        }

        showOpenButton(record);
      })
      .catch(function (err) {
        setStatus("Could not load the record from Zoho.", true);
        console.error("getRecord failed:", err);
      });
  }

  // ---------- Missing-fields form ----------
  function showMissingForm(fields) {
    openBtn.style.display = "none";
    missingFieldsEl.innerHTML = "";

    fields.forEach(function (apiName) {
      var wrap = document.createElement("div");
      wrap.className = "field";

      var label = document.createElement("label");
      label.setAttribute("for", "f_" + apiName);
      label.textContent = REQUIRED_FIELDS[apiName];

      var input = document.createElement("input");
      input.id = "f_" + apiName;
      input.name = apiName;
      input.type = INPUT_TYPES[apiName] || "text";
      input.autocomplete = "off";

      var err = document.createElement("div");
      err.className = "fieldError";
      err.id = "e_" + apiName;

      wrap.appendChild(label);
      wrap.appendChild(input);
      wrap.appendChild(err);
      missingFieldsEl.appendChild(wrap);
    });

    var labels = fields.map(function (f) { return REQUIRED_FIELDS[f]; }).join(", ");
    setStatus("Missing required info: " + labels, true);
    mainText.textContent = "Fill in the missing info before sending or starting the application.";
    missingForm.style.display = "block";

    var first = missingFieldsEl.querySelector("input");
    if (first) first.focus();
  }

  function validate(apiName, value) {
    if (isBlank(value)) return REQUIRED_FIELDS[apiName] + " is required.";
    if (apiName === "Email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
      return "Enter a valid email address.";
    }
    if (apiName === "Phone" && value.replace(/[^0-9]/g, "").length < 10) {
      return "Phone must have at least 10 digits.";
    }
    return null;
  }

  missingForm.addEventListener("submit", function (e) {
    e.preventDefault();

    var updates = { id: currentRecordId };
    var hasError = false;

    missingList.forEach(function (apiName) {
      var input = document.getElementById("f_" + apiName);
      var errEl = document.getElementById("e_" + apiName);
      var value = input.value.trim();
      var msg = validate(apiName, value);

      errEl.textContent = msg || "";
      input.classList.toggle("invalid", !!msg);
      if (msg) hasError = true;
      else updates[apiName] = value;
    });

    if (hasError) return;

    saveBtn.disabled = true;
    setStatus("Saving...");

    ZOHO.CRM.API.updateRecord({
      Entity: currentModule,
      APIData: updates,
      Trigger: ["workflow"]
    })
      .then(function (resp) {
        var result = resp && resp.data && resp.data[0];
        if (!result || result.code !== "SUCCESS") {
          throw result || resp;
        }
        missingForm.style.display = "none";
        saveBtn.disabled = false;
        // Saving fires the Lead workflow, which creates the app in Stratus in
        // the background. Wait for that to land instead of creating a second one.
        return waitForApplication();
      })
      .catch(function (err) {
        saveBtn.disabled = false;
        var detail = err && err.message ? " (" + err.message + ")" : "";
        setStatus("Could not save the Lead" + detail + ". Try again.", true);
        console.error("updateRecord failed:", err);
      });
  });

  // Only trust Application_URL if it contains this Lead's EditSlug.
  // Leads.UponCreation can leave a placeholder URL before the app exists.
  function hasRealAppUrl(record) {
    var url = record[APPLICATION_URL_FIELD];
    var slug = record.EditSlug;
    return !isBlank(slug) && !isBlank(url) && String(url).indexOf(String(slug)) !== -1;
  }

  // ---------- Wait for the workflow to generate the app ----------
  var POLL_INTERVAL_MS = 2000;
  var POLL_TIMEOUT_MS = 20000;

  function waitForApplication() {
    var started = Date.now();
    openBtn.style.display = "none";
    mainText.textContent = "Saved. Generating the application link...";

    function poll() {
      setStatus("Waiting for KurvAgent to generate the application (" +
        Math.round((Date.now() - started) / 1000) + "s)...");
      return ZOHO.CRM.API.getRecord({ Entity: currentModule, RecordID: currentRecordId })
        .then(function (response) {
          var record = response.data[0];
          if (hasRealAppUrl(record) || Date.now() - started >= POLL_TIMEOUT_MS) {
            // Found it, or gave up waiting: show the button
            // (falls back to "Create & Open Application" if still no URL).
            showOpenButton(record);
            return;
          }
          return new Promise(function (resolve) {
            setTimeout(resolve, POLL_INTERVAL_MS);
          }).then(poll);
        })
        .catch(function (err) {
          setStatus("Could not reload the record from Zoho.", true);
          console.error("poll getRecord failed:", err);
        });
    }

    return poll();
  }

  // ---------- Open button ----------
  function showOpenButton(record) {
    applicationUrl = record[APPLICATION_URL_FIELD];
    needsCreate = !hasRealAppUrl(record);
    openBtn.disabled = false;

    if (needsCreate) {
      setStatus("Ready.");
      mainText.textContent = "This Lead doesn't have an application yet. Click below to create it in KurvAgent and open it in a new tab.";
      openBtn.textContent = "Create & Open Application";
      openBtn.style.display = "inline-block";
      return;
    }

    setStatus("Ready.");
    mainText.textContent = "Click below to open this Lead's application in a new tab.";
    openBtn.textContent = "Open Application";
    openBtn.style.display = "inline-block";
  }

  ZOHO.embeddedApp.on("PageLoad", function (data) {
    currentModule = data.Entity;
    // EntityId can arrive as an array in some widget contexts
    currentRecordId = Array.isArray(data.EntityId) ? data.EntityId[0] : data.EntityId;
    loadRecord();
  });

  // Calls the standalone Deluge function; resolves with the new Application_URL.
  function createApplication() {
    return ZOHO.CRM.FUNCTIONS.execute(CREATE_APP_FUNCTION, {
      arguments: JSON.stringify({ leadId: String(currentRecordId) })
    }).then(function (resp) {
      var output = resp && resp.details && resp.details.output;
      var result = typeof output === "string" ? JSON.parse(output) : output;
      if (!result || !result.success || isBlank(result.application_url)) {
        throw new Error((result && result.message) || "No application URL returned.");
      }
      return result.application_url;
    });
  }

  openBtn.addEventListener("click", function () {
    openBtn.disabled = true;

    if (!needsCreate) {
      if (!applicationUrl) return;
      window.open(applicationUrl, "_blank");
      advanceBlueprint();
      return;
    }

    // Open the tab now (inside the click) so the browser doesn't block it,
    // then point it at the real URL once Stratus returns one.
    var tab = window.open("", "_blank");
    if (tab) {
      tab.document.write("<p style='font-family:sans-serif;padding:24px'>Creating application in KurvAgent...</p>");
    }
    setStatus("Creating application in KurvAgent...");

    createApplication()
      .then(function (url) {
        applicationUrl = url;
        if (tab && !tab.closed) tab.location.href = url;
        else window.open(url, "_blank");
        advanceBlueprint();
      })
      .catch(function (err) {
        console.error("Create application failed:", err);
        if (tab && !tab.closed) tab.close();
        openBtn.disabled = false;
        setStatus("Could not create the application: " + (err && err.message ? err.message : "unknown error") + ". Try again, or open KurvAgent manually.", true);
        needsCreate = false;
        applicationUrl = FALLBACK_URL;
        openBtn.textContent = "Open KurvAgent Instead";
      });
  });

  function advanceBlueprint() {
    setStatus("Opened in a new tab. Advancing to Application Started...");
    ZOHO.CRM.BLUEPRINT.proceed()
      .then(function () {
        if (ZOHO.CRM.UI.Popup && ZOHO.CRM.UI.Popup.closeReload) {
          ZOHO.CRM.UI.Popup.closeReload();
        } else {
          setStatus("Done. Refresh the page to see the updated stage.");
        }
      })
      .catch(function (err) {
        openBtn.disabled = false;
        setStatus("Could not advance the blueprint — try again.", true);
        console.error("BLUEPRINT.proceed failed:", err);
      });
  }

  ZOHO.embeddedApp.init();
})();
</script>
</body>
</html>
