<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Open KurvAgent Application (iframe demo)</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #ffffff;
    color: #1f2937;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  #statusBar {
    padding: 10px 14px;
    font-size: 13px;
    border-bottom: 1px solid #e5e7eb;
    color: #4b5563;
    flex: 0 0 auto;
  }
  #statusBar.error {
    color: #b91c1c;
    background: #fef2f2;
  }
  #frameHolder {
    flex: 1 1 auto;
    position: relative;
  }
  #frameHolder iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
  #actionBar {
    flex: 0 0 auto;
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    padding: 10px 14px;
    border-top: 1px solid #e5e7eb;
  }
  button {
    font-size: 14px;
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid #d1d5db;
    background: #fff;
    cursor: pointer;
  }
  button.primary {
    background: #2563eb;
    border-color: #2563eb;
    color: #fff;
  }
  button.primary:disabled {
    background: #93c5fd;
    border-color: #93c5fd;
    cursor: not-allowed;
  }
  button:hover:not(:disabled) {
    filter: brightness(0.97);
  }
  #placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: #6b7280;
    font-size: 14px;
    padding: 24px;
    text-align: center;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="statusBar">Loading application...</div>
  <div id="frameHolder">
    <div id="placeholder">Waiting for record data from Zoho...</div>
  </div>
  <div id="actionBar">
    <button id="reloadBtn">Reload application</button>
    <button id="cancelBtn">Cancel</button>
    <button id="continueBtn" class="primary" disabled>I've started the application &mdash; Continue</button>
  </div>
</div>

<!-- DEMO ONLY: this is the original iframe version, kept for comparison.
     It hits a CSRF Token Mismatch on KurvAgent's login because the browser
     blocks KurvAgent's session cookie inside a third-party iframe. This is
     not the version wired into the live blueprint transition. -->
<script src="https://live.zwidgets.com/js-sdk/1.1/ZohoEmbededAppSDK.min.js"></script>

<script>
(function () {
  var KURVAGENT_URL = "https://agent.kurvpay.com/";

  var statusBar = document.getElementById("statusBar");
  var frameHolder = document.getElementById("frameHolder");
  var continueBtn = document.getElementById("continueBtn");
  var cancelBtn = document.getElementById("cancelBtn");
  var reloadBtn = document.getElementById("reloadBtn");

  var currentModule = null;
  var currentRecordId = null;

  function setStatus(msg, isError) {
    statusBar.textContent = msg;
    statusBar.className = isError ? "error" : "";
  }

  function renderIframe(url) {
    frameHolder.innerHTML = "";
    var iframe = document.createElement("iframe");
    iframe.src = url;
    frameHolder.appendChild(iframe);
    continueBtn.disabled = false;
    setStatus("Log in and set up this merchant in KurvAgent, then click Continue.");
  }

  if (typeof ZOHO === "undefined") {
    setStatus(
      "This page must be opened inside a Zoho CRM widget, not previewed standalone " +
        "(the Zoho SDK script did not load).",
      true
    );
    frameHolder.innerHTML =
      '<div id="placeholder">Zoho SDK not detected.<br>' +
      "Test this by attaching it to the blueprint transition in Zoho CRM " +
      "(sandbox), not by opening this file directly.</div>";
    return;
  }

  ZOHO.embeddedApp.on("PageLoad", function (data) {
    currentModule = data.Entity;
    currentRecordId = data.EntityId;
    renderIframe(KURVAGENT_URL);
  });

  continueBtn.addEventListener("click", function () {
    continueBtn.disabled = true;
    setStatus("Advancing to Application Started...");
    ZOHO.CRM.BLUEPRINT.proceed()
      .then(function () {
        if (ZOHO.CRM.UI.Popup && ZOHO.CRM.UI.Popup.closeReload) {
          ZOHO.CRM.UI.Popup.closeReload();
        } else {
          setStatus("Done. Refresh the page to see the updated stage.");
        }
      })
      .catch(function (err) {
        continueBtn.disabled = false;
        setStatus("Could not advance the blueprint — try again.", true);
        console.error("BLUEPRINT.proceed failed:", err);
      });
  });

  reloadBtn.addEventListener("click", function () {
    renderIframe(KURVAGENT_URL);
  });

  cancelBtn.addEventListener("click", function () {
    if (ZOHO.CRM.UI && ZOHO.CRM.UI.Popup && ZOHO.CRM.UI.Popup.close) {
      ZOHO.CRM.UI.Popup.close();
    }
  });

  ZOHO.embeddedApp.init();
})();
</script>
</body>
</html>
