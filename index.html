<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Open KurvAgent Application</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #ffffff;
    color: #1f2937;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  #statusBar {
    padding: 10px 14px;
    font-size: 13px;
    border-bottom: 1px solid #e5e7eb;
    color: #4b5563;
    flex: 0 0 auto;
  }
  #statusBar.error {
    color: #b91c1c;
    background: #fef2f2;
  }
  #main {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    text-align: center;
  }
  #main p {
    color: #6b7280;
    font-size: 14px;
    max-width: 360px;
    margin: 0;
  }
  #actionBar {
    flex: 0 0 auto;
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    padding: 10px 14px;
    border-top: 1px solid #e5e7eb;
  }
  button {
    font-size: 14px;
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid #d1d5db;
    background: #fff;
    cursor: pointer;
  }
  button.primary {
    background: #2563eb;
    border-color: #2563eb;
    color: #fff;
  }
  button.primary:disabled {
    background: #93c5fd;
    border-color: #93c5fd;
    cursor: not-allowed;
  }
  button:hover:not(:disabled) {
    filter: brightness(0.97);
  }
  #openBtn {
    font-size: 16px;
    padding: 12px 24px;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="statusBar">Loading...</div>
  <div id="main">
    <p>This opens KurvAgent in a new tab so you can log in and set up the merchant (pricing, equipment, etc.).</p>
    <button id="openBtn" class="primary">Open KurvAgent</button>
  </div>
  <div id="actionBar">
    <button id="cancelBtn">Cancel</button>
    <button id="continueBtn" class="primary" disabled>I've started the application &mdash; Continue</button>
  </div>
</div>

<!--
  Zoho CRM Widget JS SDK.
  NOTE: verify this script src / version against your org's current Developer
  Space widget template before shipping — Zoho periodically revs the SDK path
  (currently believed to be /js-sdk/1.1/ or /js-sdk/1.2/ under live.zwidgets.com).
-->
<script src="https://live.zwidgets.com/js-sdk/1.1/ZohoEmbededAppSDK.min.js"></script>

<script>
(function () {
  // 2026-08-25: switched from an iframe to opening KurvAgent in a new tab.
  // KurvAgent's login relies on a session cookie that browsers block inside a
  // third-party iframe (confirmed CSRF Token Mismatch). Their dev can't
  // relax that cookie's SameSite setting without risking a pentest finding,
  // so the iframe route is off the table for good. Opening in a normal tab
  // sidesteps the issue entirely since it's no longer a cross-site embed.
  //
  // Application_URL is not written by this widget — that's still meant to
  // come back automatically via a future KurvAgent-side webhook (see plan doc).
  var KURVAGENT_URL = "https://agent.kurvpay.com/";
  var KURVAGENT_TAB_NAME = "kurvAgentApplicationTab"; // reuse the same tab on repeat clicks

  var statusBar = document.getElementById("statusBar");
  var openBtn = document.getElementById("openBtn");
  var continueBtn = document.getElementById("continueBtn");
  var cancelBtn = document.getElementById("cancelBtn");

  var currentModule = null;
  var currentRecordId = null;

  function setStatus(msg, isError) {
    statusBar.textContent = msg;
    statusBar.className = isError ? "error" : "";
  }

  // Guard: if the Zoho widget SDK script above didn't load (network issue,
  // wrong version, or this page being opened outside a real Zoho CRM widget
  // context), fail loudly on-screen instead of hanging on "Loading..."
  // forever with only a console error to explain why.
  if (typeof ZOHO === "undefined") {
    setStatus(
      "This page must be opened inside a Zoho CRM widget, not previewed standalone " +
        "(the Zoho SDK script did not load).",
      true
    );
    document.getElementById("main").innerHTML =
      "<p>Zoho SDK not detected.<br>" +
      "Test this by attaching it to the blueprint transition in Zoho CRM " +
      "(sandbox), not by opening this file directly.</p>";
    return;
  }

  // 1. Wait for Zoho to hand us the record context.
  ZOHO.embeddedApp.on("PageLoad", function (data) {
    currentModule = data.Entity;       // e.g. "Leads"
    currentRecordId = data.EntityId;   // the Lead's record id
    setStatus("Ready. Click \"Open KurvAgent\" to log in and set up this merchant.");
  });

  // 2. Rep clicks "Open KurvAgent" -> opens in a real new tab (not embedded),
  //    which avoids the cross-site cookie issue entirely. Using a named
  //    target means clicking it again reuses the same tab instead of
  //    spawning a new one each time.
  openBtn.addEventListener("click", function () {
    window.open(KURVAGENT_URL, KURVAGENT_TAB_NAME);
    continueBtn.disabled = false;
    setStatus("Log in and set up this merchant in the KurvAgent tab, then come back here and click Continue.");
  });

  // 3. Rep confirms the application was actually opened/started ->
  //    advance the blueprint into "Application Started".
  //    NOTE: verify ZOHO.CRM.BLUEPRINT.proceed() against the current
  //    Zoho widget SDK reference (zohocrm.dev) before relying on this in
  //    production — confirmed to exist per Zoho's Kaizen #95 writeup, but
  //    the exact call signature should be double-checked in sandbox.
  continueBtn.addEventListener("click", function () {
    continueBtn.disabled = true;
    setStatus("Advancing to Application Started...");
    ZOHO.CRM.BLUEPRINT.proceed()
      .then(function () {
        // Close the widget AND refresh the Lead record page, so the rep
        // sees the new blueprint stage immediately instead of having to
        // manually refresh the browser.
        if (ZOHO.CRM.UI.Popup && ZOHO.CRM.UI.Popup.closeReload) {
          ZOHO.CRM.UI.Popup.closeReload();
        } else {
          setStatus("Done. Refresh the page to see the updated stage.");
        }
      })
      .catch(function (err) {
        continueBtn.disabled = false;
        setStatus("Could not advance the blueprint — try again.", true);
        console.error("BLUEPRINT.proceed failed:", err);
      });
  });

  cancelBtn.addEventListener("click", function () {
    if (ZOHO.CRM.UI && ZOHO.CRM.UI.Popup && ZOHO.CRM.UI.Popup.close) {
      ZOHO.CRM.UI.Popup.close();
    }
  });

  ZOHO.embeddedApp.init();
})();
</script>
</body>
</html>
