<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Open Stratus Application</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #ffffff;
    color: #1f2937;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  #statusBar {
    padding: 10px 14px;
    font-size: 13px;
    border-bottom: 1px solid #e5e7eb;
    color: #4b5563;
    flex: 0 0 auto;
  }
  #statusBar.error {
    color: #b91c1c;
    background: #fef2f2;
  }
  #frameHolder {
    flex: 1 1 auto;
    position: relative;
  }
  #frameHolder iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
  #linkBar {
    flex: 0 0 auto;
    padding: 10px 14px;
    border-top: 1px solid #e5e7eb;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  #linkBar label {
    font-size: 12px;
    color: #4b5563;
  }
  #linkBar input {
    font-size: 14px;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid #d1d5db;
  }
  #linkBar input:focus {
    outline: 2px solid #2563eb;
    outline-offset: -1px;
  }
  #actionBar {
    flex: 0 0 auto;
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    padding: 10px 14px;
    border-top: 1px solid #e5e7eb;
  }
  button {
    font-size: 14px;
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid #d1d5db;
    background: #fff;
    cursor: pointer;
  }
  button.primary {
    background: #2563eb;
    border-color: #2563eb;
    color: #fff;
  }
  button.primary:disabled {
    background: #93c5fd;
    border-color: #93c5fd;
    cursor: not-allowed;
  }
  button:hover:not(:disabled) {
    filter: brightness(0.97);
  }
  #placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: #6b7280;
    font-size: 14px;
    padding: 24px;
    text-align: center;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="statusBar">Loading application...</div>
  <div id="frameHolder">
    <div id="placeholder">Waiting for record data from Zoho...</div>
  </div>
  <div id="linkBar">
    <label for="appLinkInput">Paste the unique application link Stratus gave you after creating it:</label>
    <input id="appLinkInput" type="url" placeholder="https://stratusapp.io/app/..." />
  </div>
  <div id="actionBar">
    <button id="reloadBtn">Reload application</button>
    <button id="cancelBtn">Cancel</button>
    <button id="continueBtn" class="primary" disabled>I've started the application &mdash; Continue</button>
  </div>
</div>

<!--
  Zoho CRM Widget JS SDK.
  NOTE: verify this script src / version against your org's current Developer
  Space widget template before shipping — Zoho periodically revs the SDK path
  (currently believed to be /js-sdk/1.1/ or /js-sdk/1.2/ under live.zwidgets.com).
-->
<script src="https://live.zwidgets.com/js-sdk/1.1/ZohoEmbededAppSDK.min.js"></script>

<script>
(function () {
  // Static entry point: the AE logs into their own Stratus account inside
  // this iframe and finds/sets up the merchant manually (pricing, equipment,
  // etc. require an authenticated internal Stratus session — the per-Lead
  // Application_URL link doesn't grant that, so we stopped relying on it
  // here as of 2026-08-25).
  var STRATUS_URL = "https://stratusapp.io/";

  var APPLICATION_URL_FIELD = "Application_URL"; // Lead field confirmed live 2026-08-25
  var statusBar = document.getElementById("statusBar");
  var frameHolder = document.getElementById("frameHolder");
  var continueBtn = document.getElementById("continueBtn");
  var cancelBtn = document.getElementById("cancelBtn");
  var reloadBtn = document.getElementById("reloadBtn");
  var appLinkInput = document.getElementById("appLinkInput");

  var currentModule = null;
  var currentRecordId = null;

  function setStatus(msg, isError) {
    statusBar.textContent = msg;
    statusBar.className = isError ? "error" : "";
  }

  function renderIframe(url) {
    frameHolder.innerHTML = "";
    var iframe = document.createElement("iframe");
    iframe.src = url;
    // Stratus's hosted application page is confirmed to allow framing
    // (checked 2026-08-25). If that ever changes, replace this iframe
    // with a redirect / "open in new tab" link instead.
    frameHolder.appendChild(iframe);
    setStatus("Log in and set up this merchant in Stratus. Once you've created " +
      "the application, paste its unique link below and click Continue.");
  }

  // Continue stays disabled until the AE has pasted something that at least
  // looks like a URL into the link box — this is what lets us correlate the
  // Stratus application back to this Lead later (see plan doc, 2026-08-25
  // revision: the AE creates the merchant manually inside Stratus now, so
  // there's no automatic pre-linked URL like the old design assumed).
  appLinkInput.addEventListener("input", function () {
    var val = appLinkInput.value.trim();
    continueBtn.disabled = !(val.length > 0 && /^https?:\/\//i.test(val));
  });

  // Guard: if the Zoho widget SDK script above didn't load (network issue,
  // wrong version, or this page being opened outside a real Zoho CRM widget
  // context), fail loudly on-screen instead of hanging on "Loading
  // application..." forever with only a console error to explain why.
  if (typeof ZOHO === "undefined") {
    setStatus(
      "This page must be opened inside a Zoho CRM widget, not previewed standalone " +
        "(the Zoho SDK script did not load).",
      true
    );
    frameHolder.innerHTML =
      '<div id="placeholder">Zoho SDK not detected.<br>' +
      "Test this by attaching it to the blueprint transition in Zoho CRM " +
      "(sandbox), not by opening this file directly.</div>";
    return;
  }

  // 1. Wait for Zoho to hand us the record context. We need EntityId to
  //    later save the pasted application link back onto this exact Lead.
  ZOHO.embeddedApp.on("PageLoad", function (data) {
    currentModule = data.Entity;       // e.g. "Leads"
    currentRecordId = data.EntityId;   // the Lead's record id

    renderIframe(STRATUS_URL);
  });

  // 3. Rep pastes the unique application link Stratus generated, we save it
  //    onto the Lead (so a later Stratus->Zoho webhook can match on it),
  //    then advance the blueprint into "Application Started".
  //    NOTE: verify ZOHO.CRM.BLUEPRINT.proceed() against the current
  //    Zoho widget SDK reference (zohocrm.dev) before relying on this in
  //    production — confirmed to exist per Zoho's Kaizen #95 writeup, but
  //    the exact call signature should be double-checked in sandbox.
  continueBtn.addEventListener("click", function () {
    var appLink = appLinkInput.value.trim();
    if (!appLink) {
      setStatus("Paste the application link before continuing.", true);
      return;
    }

    continueBtn.disabled = true;
    appLinkInput.disabled = true;
    setStatus("Saving application link...");

    ZOHO.CRM.API.updateRecord({
      Entity: currentModule,
      APIData: {
        id: currentRecordId,
        Application_URL: appLink
      }
    })
      .then(function () {
        setStatus("Advancing to Application Started...");
        return ZOHO.CRM.BLUEPRINT.proceed();
      })
      .then(function () {
        // Close the widget AND refresh the Lead record page, so the rep
        // sees the new blueprint stage immediately instead of having to
        // manually refresh the browser.
        if (ZOHO.CRM.UI.Popup && ZOHO.CRM.UI.Popup.closeReload) {
          ZOHO.CRM.UI.Popup.closeReload();
        } else {
          setStatus("Done. Refresh the page to see the updated stage.");
        }
      })
      .catch(function (err) {
        continueBtn.disabled = false;
        appLinkInput.disabled = false;
        setStatus("Something went wrong saving the link or advancing the blueprint — try again.", true);
        console.error("updateRecord/BLUEPRINT.proceed failed:", err);
      });
  });

  // Stratus's login page occasionally throws a "CSRF Token Mismatch" on
  // first load inside the iframe, which clears up on a reload. Resetting
  // src forces the iframe to reload without touching anything else on the
  // Zoho page (the pasted link below is untouched).
  reloadBtn.addEventListener("click", function () {
    renderIframe(STRATUS_URL);
  });

  cancelBtn.addEventListener("click", function () {
    if (ZOHO.CRM.UI && ZOHO.CRM.UI.Popup && ZOHO.CRM.UI.Popup.close) {
      ZOHO.CRM.UI.Popup.close();
    }
  });

  ZOHO.embeddedApp.init();
})();
</script>
</body>
</html>
