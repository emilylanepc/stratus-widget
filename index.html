<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Open KurvAgent</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #ffffff;
  }
  #main {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 24px;
    box-sizing: border-box;
  }
  #openBtn {
    font-size: 16px;
    padding: 12px 24px;
    border-radius: 6px;
    border: 1px solid #22a276;
    background: #22a276;
    color: #fff;
    cursor: pointer;
  }
  #openBtn:disabled {
    background: #8fd0b8;
    border-color: #8fd0b8;
    cursor: not-allowed;
  }
  /* Hidden unless something goes wrong */
  #errorMsg {
    display: none;
    color: #b91c1c;
    font-size: 13px;
    text-align: center;
    max-width: 320px;
  }
</style>
</head>
<body>
<div id="main">
  <button id="openBtn">Open KurvAgent</button>
  <div id="errorMsg"></div>
</div>

<script src="https://live.zwidgets.com/js-sdk/1.1/ZohoEmbededAppSDK.min.js"></script>

<script>
(function () {
  // Opens KurvAgent outside of any iframe (its login cookie is blocked in
  // third-party iframes -> CSRF Token Mismatch).
  var KURVAGENT_URL = "https://agent.kurvpay.com/";
  var KURVAGENT_TAB_NAME = "kurvAgentApplicationTab";
  var IS_MOBILE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

  var openBtn = document.getElementById("openBtn");
  var errorMsg = document.getElementById("errorMsg");

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.display = "block";
  }

  if (typeof ZOHO === "undefined") {
    openBtn.disabled = true;
    showError("The Zoho SDK did not load. Open this from the button in Zoho CRM.");
    return;
  }

  // Advances the blueprint only if this widget is inside a blueprint
  // transition. On a plain button the call rejects, which we treat as
  // "nothing to advance" rather than an error.
  function tryAdvanceBlueprint() {
    if (!ZOHO.CRM.BLUEPRINT || !ZOHO.CRM.BLUEPRINT.proceed) {
      return Promise.resolve(false);
    }
    return ZOHO.CRM.BLUEPRINT.proceed()
      .then(function () { return true; })
      .catch(function (err) {
        console.warn("No blueprint to advance:", err);
        return false;
      });
  }

  openBtn.addEventListener("click", function () {
    openBtn.disabled = true;

    if (IS_MOBILE) {
      // Mobile: don't open a new window. The Zoho app's in-app browser was
      // receiving a blank page instead of the URL. Load KurvAgent right here
      // in the widget's own screen instead; the top-left back arrow returns
      // to the Lead.
      tryAdvanceBlueprint().then(function () {
        window.location.href = KURVAGENT_URL;
      });
      return;
    }

    // Desktop: open the tab synchronously inside the click so it isn't
    // blocked, then close the popup.
    window.open(KURVAGENT_URL, KURVAGENT_TAB_NAME);
    tryAdvanceBlueprint().then(function (advanced) {
      if (advanced && ZOHO.CRM.UI.Popup && ZOHO.CRM.UI.Popup.closeReload) {
        ZOHO.CRM.UI.Popup.closeReload();
      } else if (ZOHO.CRM.UI.Popup && ZOHO.CRM.UI.Popup.close) {
        ZOHO.CRM.UI.Popup.close();
      }
    });
  });

  ZOHO.embeddedApp.init();
})();
</script>
</body>
</html>
